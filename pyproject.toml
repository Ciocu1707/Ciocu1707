[project]
name = "youtube-agent"
version = "0.1.0"
description = "A Claude-powered YouTube agent: video Q&A and summaries, creator content help, channel research, and upload automation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.5.0",
    "youtube-transcript-api>=1.2",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
youtube-agent = "youtube_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["youtube_agent*"]
